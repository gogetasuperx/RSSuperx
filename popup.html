<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      width: 520px;
      max-height: 580px;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      background: #000000;
      color: #e8eaed;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #3c4043;
      font-weight: bold;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-buttons button {
      cursor: pointer;
      border: 1px solid #3c4043;
      background: #202124;
      color: #e8eaed;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: normal;
    }

    .header-buttons button:hover {
      background: #303134;
    }

    section {
      padding: 10px;
      border-bottom: 1px solid #1f1f1f;
    }

    .subscribe {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 240px;
      padding: 6px;
      border: 1px solid #3c4043;
      border-radius: 4px;
      background: #111111;
      color: #e8eaed;
    }

    input::placeholder {
      color: #9aa0a6;
    }

    #feedName {
      flex: 0 1 140px;
      min-width: 120px;
    }

    button {
      cursor: pointer;
      border: 1px solid #3c4043;
      background: #202124;
      color: #e8eaed;
      border-radius: 4px;
      padding: 6px 10px;
    }

    button:hover {
      background: #303134;
    }

    .error {
      width: 100%;
      color: #ff4d4f;
      font-size: 12px;
      margin-top: 4px;
      min-height: 14px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow: auto;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid #1f1f1f;
    }

    li.empty {
      color: #9aa0a6;
      text-align: center;
      padding: 16px;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .feed-name-input {
      flex: 0 1 140px;
      min-width: 120px;
      padding: 4px;
      font-size: 12px;
    }

    .feed-url {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #9aa0a6;
      font-size: 12px;
    }

    .feed-count {
      min-width: 22px;
      text-align: center;
      background: #d93025;
      color: #ffffff;
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 11px;
      flex: none;
    }

    .feed-count.zero {
      background: #3c4043;
      color: #9aa0a6;
    }

    .small {
      padding: 2px 8px;
      font-size: 11px;
    }

    a {
      color: #8ab4f8;
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }

    a:hover {
      text-decoration: underline;
    }

    .meta {
      color: #9aa0a6;
      font-size: 11px;
    }

    .unread {
      background: #1a1111;
    }

    #fatalError {
      color: #ff4d4f;
      white-space: pre-wrap;
      padding: 8px;
      font-size: 12px;
    }

    #importFile {
      display: none;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
      display: inline-block;
    }

    .status-dot.ok {
      background: #34a853;
    }

    .status-dot.error {
      background: #ea4335;
    }

    .status-dot.unknown {
      background: #9aa0a6;
    }
  </style>
</head>
<body>
  <header>
    <span>RSSuperx</span>

    <div class="header-buttons">
      <button id="dismissAll" title="Mark all new items as read.">
        Dismiss all
      </button>

      <button id="exportData" title="Download your feeds and seen-memory backup.">
        Export
      </button>

      <button id="importButton" title="Restore feeds and seen-memory from a backup file.">
        Import
      </button>
    </div>
  </header>

  <input
    type="file"
    id="importFile"
    accept=".json,application/json"
  />

  <section class="subscribe">
    <input
      id="feedName"
      type="text"
      placeholder="Name (optional)"
    />

    <input
      id="feedUrl"
      type="text"
      placeholder="Paste RSS/Atom feed URL"
    />

    <button id="addFeed">
      Add feed
    </button>

    <div id="feedError" class="error"></div>
  </section>

  <section>
    <div class="section-title">Subscribed feeds</div>
    <ul id="feedList"></ul>
  </section>

  <section>
    <div class="section-title">New items</div>
    <ul id="list"></ul>
  </section>

  <pre id="fatalError"></pre>

  <script src="popup.js"></script>
</body>
</html>
