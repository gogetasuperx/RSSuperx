<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      width: 520px;
      max-height: 580px;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;

      background: var(--bg);
      color: var(--text);

      --bg: #000000;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #3c4043;
      --border-soft: #1f1f1f;
      --input-bg: #111111;
      --button-bg: #202124;
      --button-hover: #303134;
      --link: #8ab4f8;
      --error: #ff4d4f;
      --unread-bg: #1a1111;

      --count-bg: #d93025;
      --count-text: #ffffff;
      --count-zero-bg: #3c4043;
      --count-zero-text: #9aa0a6;

      --status-ok: #34a853;
      --status-error: #ea4335;
      --status-unknown: #9aa0a6;

      color-scheme: dark;
    }

    body[data-theme="dim"] {
      --bg: #121212;
      --border-soft: #232323;
      --input-bg: #1a1a1a;
      --button-bg: #242424;
      --button-hover: #323232;
      --unread-bg: #241414;
    }

    body[data-theme="light"] {
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --border-soft: #e8eaed;
      --input-bg: #ffffff;
      --button-bg: #f8f9fa;
      --button-hover: #e8eaed;
      --link: #1a73e8;
      --error: #d93025;
      --unread-bg: #fff8f8;

      --count-zero-bg: #e8eaed;
      --count-zero-text: #5f6368;

      color-scheme: light;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-buttons button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--button-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: normal;
    }

    .header-buttons button:hover {
      background: var(--button-hover);
    }

    section {
      padding: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .subscribe {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 240px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text);
    }

    input::placeholder {
      color: var(--muted);
    }

    #feedName {
      flex: 0 1 140px;
      min-width: 120px;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--button-bg);
      color: var(--text);
      border-radius: 4px;
      padding: 6px 10px;
    }

    button:hover {
      background: var(--button-hover);
    }

    .error {
      width: 100%;
      color: var(--error);
      font-size: 12px;
      margin-top: 4px;
      min-height: 14px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow: auto;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid var(--border-soft);
    }

    li.empty {
      color: var(--muted);
      text-align: center;
      padding: 16px;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .feed-name-input {
      flex: 0 1 140px;
      min-width: 120px;
      padding: 4px;
      font-size: 12px;
    }

    .feed-url {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
    }

    .feed-count {
      min-width: 22px;
      text-align: center;
      background: var(--count-bg);
      color: var(--count-text);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 11px;
      flex: none;
    }

    .feed-count.zero {
      background: var(--count-zero-bg);
      color: var(--count-zero-text);
    }

    .small {
      padding: 2px 8px;
      font-size: 11px;
    }

    a {
      color: var(--link);
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }

    a:hover {
      text-decoration: underline;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
    }

    .unread {
      background: var(--unread-bg);
    }

    #fatalError {
      color: var(--error);
      white-space: pre-wrap;
      padding: 8px;
      font-size: 12px;
    }

    #importFile {
      display: none;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
      display: inline-block;
    }

    .status-dot.ok {
      background: var(--status-ok);
    }

    .status-dot.error {
      background: var(--status-error);
    }

    .status-dot.unknown {
      background: var(--status-unknown);
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .select-label {
      font-size: 12px;
      color: var(--text);
    }

    select {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px;
      max-width: 180px;
      cursor: pointer;
    }

    select:hover {
      border-color: var(--muted);
    }
  </style>
</head>
<body data-theme="black">
  <header>
    <span>RSSuperx</span>

    <div class="header-buttons">
      <button id="dismissAll" title="Mark all new items as read.">
        Dismiss all
      </button>

      <button id="exportData" title="Download your feeds and seen-memory backup.">
        Export
      </button>

      <button id="importButton" title="Restore feeds and seen-memory from a backup file.">
        Import
      </button>
    </div>
  </header>

  <input
    type="file"
    id="importFile"
    accept=".json,application/json"
  />

  <section class="subscribe">
    <input
      id="feedName"
      type="text"
      placeholder="Name (optional)"
    />

    <input
      id="feedUrl"
      type="text"
      placeholder="Paste RSS/Atom feed URL"
    />

    <button id="addFeed">
      Add feed
    </button>

    <div id="feedError" class="error"></div>
  </section>

  <section class="settings-row">
    <label class="select-label" for="themeSelect">
      Theme
    </label>

    <select id="themeSelect">
      <option value="black" selected>Black</option>
      <option value="dim">Dim</option>
      <option value="light">Light</option>
    </select>
  </section>

  <section>
    <div class="section-title">Subscribed feeds</div>
    <ul id="feedList"></ul>
  </section>

  <section>
    <div class="section-title">New items</div>
    <ul id="list"></ul>
  </section>

  <pre id="fatalError"></pre>

  <script src="popup.js"></script>
</body>
</html>
