<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 460px;
      max-height: 580px;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #202124;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #dadce0;
      font-weight: bold;
    }

    .header-buttons button {
      margin-left: 6px;
      cursor: pointer;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: normal;
    }

    .header-buttons button:hover {
      background: #e8eaed;
    }

    section {
      padding: 10px;
      border-bottom: 1px solid #e8eaed;
    }

    .subscribe {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 240px;
      padding: 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
    }

    button {
      cursor: pointer;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      border-radius: 4px;
      padding: 6px 10px;
    }

    button:hover {
      background: #e8eaed;
    }

    .error {
      width: 100%;
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
      min-height: 14px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow: auto;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid #e8eaed;
    }

    li.empty {
      color: #5f6368;
      text-align: center;
      padding: 16px;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .feed-url {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #5f6368;
      font-size: 12px;
    }

    .small {
      padding: 2px 8px;
      font-size: 11px;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }

    a:hover {
      text-decoration: underline;
    }

    .meta {
      color: #5f6368;
      font-size: 11px;
    }

    .unread {
      background: #fff8f8;
    }

    .settings {
      display: flex;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: normal;
      user-select: none;
    }

    .toggle input {
      flex: none;
      min-width: auto;
      width: auto;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    #fatalError {
      color: #d93025;
      white-space: pre-wrap;
      padding: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <span>RSSuperx</span>

    <div class="header-buttons">
      <button id="clearItems" title="Removes saved articles but keeps your feeds">
        Clear items
      </button>
    </div>
  </header>

  <section class="subscribe">
    <input
      id="feedUrl"
      type="text"
      placeholder="Paste RSS/Atom feed URL"
    />

    <button id="addFeed">
      Add feed
    </button>

    <div id="feedError" class="error"></div>
  </section>

  <section class="settings">
    <label
      class="toggle"
      title="When enabled, opening RSSuperx clears the badge automatically."
    >
      <input type="checkbox" id="autoMarkRead" checked />
      Auto-clear badge when popup opens
    </label>
  </section>

  <section>
    <div class="section-title">Subscribed feeds</div>
    <ul id="feedList"></ul>
  </section>

  <section>
    <div class="section-title">Items</div>
    <ul id="list"></ul>
  </section>

  <pre id="fatalError"></pre>

  <script src="popup.js"></script>
</body>
</html>
